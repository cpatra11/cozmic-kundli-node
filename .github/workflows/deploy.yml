name: Deploy to EC2

on:
  push:
    branches: [feat/agent-mode-classification-guardrails]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone be1
        uses: actions/checkout@v4
        with:
          repository: cpatra11/cozmicai-kundli-be
          ref: feat/d6-shashtamsa-varga
          path: be1
          token: ${{ secrets.BE1_PAT }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3

      - name: Install be1 dependencies
        run: |
          cd be1/api
          composer install --no-dev --optimize-autoloader --no-scripts --no-interaction
          if [ ! -f vendor/autoload_runtime.php ]; then
            echo '<?php require_once __DIR__."/autoload.php";' | tee vendor/autoload_runtime.php
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Build cozmic
        run: |
          npm ci --legacy-peer-deps
          npm run build

      - name: Fix permissions on EC2
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 120s
          script: |
            sudo chown -R ubuntu:ubuntu /opt/be1 /opt/cozmic

      - name: Deploy be1
        continue-on-error: true
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "be1/api/lib,be1/api/src,be1/api/vendor,be1/api/composer.*,be1/api/Caddyfile,be1/api/public,be1/api/swetest"
          target: "/opt/be1"
          strip_components: 1
          rm: false

      - name: Deploy cozmic
        continue-on-error: true
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "dist,node_modules,package.json"
          target: "/opt/cozmic"
          strip_components: 0
          rm: false

      - name: Setup Firebase service account
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 120s
          script: |
            echo '${{ secrets.FIREBASE_SA_JSON }}' | base64 -d > /opt/cozmic/firebase-service-account.json
            if grep -q 'FIREBASE_SERVICE_ACCOUNT_PATH' /opt/cozmic/.env; then
              sed -i 's|FIREBASE_SERVICE_ACCOUNT_PATH=.*|FIREBASE_SERVICE_ACCOUNT_PATH=/opt/cozmic/firebase-service-account.json|' /opt/cozmic/.env
            else
              echo 'FIREBASE_SERVICE_ACCOUNT_PATH=/opt/cozmic/firebase-service-account.json' >> /opt/cozmic/.env
            fi
            if grep -q 'AWS_BEARER_TOKEN_BEDROCK' /opt/cozmic/.env; then
              sed -i 's|AWS_BEARER_TOKEN_BEDROCK=.*|AWS_BEARER_TOKEN_BEDROCK=${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}|' /opt/cozmic/.env
            else
              echo 'AWS_BEARER_TOKEN_BEDROCK=${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}' >> /opt/cozmic/.env
            fi

      - name: Restart both services
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 120s
          script: |
            sudo systemctl restart be1
            sudo systemctl restart cozmic
            sleep 3
            echo "be1: $(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/ping)"
            echo "cozmic: $(curl -s -o /dev/null -w '%{http_code}' http://localhost:8789/health)"
