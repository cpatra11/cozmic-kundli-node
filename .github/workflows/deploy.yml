name: Deploy cozmic to EC2

on:
  push:
    branches: [feat/conversation-memory-cleanup]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci --omit=dev
      - run: npm run build

      - name: Deploy via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "dist,node_modules,package.json"
          target: "/opt/cozmic/services/cozmic-rag-agents"
          strip_components: 0
          rm: false

      - name: Restart cozmic
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo systemctl restart cozmic
            sleep 3
            echo "Health: $(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/health)"
