name: Deploy to EC2

on:
  push:
    branches: [feat/conversation-memory-cleanup]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy be1
        run: |
          cd /opt/be1/api
          git fetch origin feat/d6-shashtamsa-varga
          git reset --hard origin/feat/d6-shashtamsa-varga
          composer install --no-dev --optimize-autoloader --no-scripts --no-interaction
          if [ ! -f vendor/autoload_runtime.php ]; then
            echo '<?php require_once __DIR__."/autoload.php";' | tee vendor/autoload_runtime.php
          fi

      - name: Deploy cozmic
        run: |
          cd /opt/cozmic
          git fetch origin feat/conversation-memory-cleanup
          git reset --hard origin/feat/conversation-memory-cleanup
          npm ci --legacy-peer-deps
          npm run build

      - name: Restart both services
        run: |
          sudo systemctl restart be1 cozmic
          sleep 3
          echo "be1: $(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/ping)"
          echo "cozmic: $(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/health)"
